# This site's own effects for the Code section, each running live beside the real code behind it. `live` names
# the preview Code.astro draws; `excerpt` names a cut that src/lib/excerpts.ts makes from the source at build
# time, so the code shown never drifts.
site_experiments:
  - id: painted-sky
    title: The painted sky
    text: A seeded generator lays down every brush dab of the swirl and the stars, the way Van Gogh laid paint along a flow, so each build draws the same sky.
    tags: [TypeScript, SVG, Seeded random]
    live: sky
    excerpt: painted-sky
    lang: javascript
  - id: constellation
    title: The constellation
    text: Stars drift on a canvas, part around your pointer and join up in a wave from the swirl's star. It pauses off screen and stops for reduced motion.
    tags: [Canvas 2D, Animation loop, Reduced motion]
    live: constellation
    excerpt: constellation
    lang: javascript
  - id: notch
    title: The notch button
    text: Two gaps in the border slide to the opposite corners on hover and focus. One clip-path with twelve points, so the gaps are real holes.
    tags: [CSS clip-path, Transitions, Focus states]
    live: notch
    excerpt: notch
    lang: css
  - id: skills-sky
    title: The skills sky
    text: Every skill sits on an oval CSS works out with sqrt(), and the role you're reading lights its own stars, joined by one line.
    tags: [CSS math, IntersectionObserver, Astro]
    live: skills-sky
    excerpt: skills-sky
    lang: css

