<!DOCTYPE html>
<!-- Template for assets/media/og.jpg (1200x630). Render it to PNG with any headless Chrome, then convert:
       chrome --headless --screenshot=og.png --window-size=1200,630 tools/og.html
       sips -s format jpeg -s formatOptions 82 og.png --out assets/media/og.jpg -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "DM Serif Display"; src: url("../assets/fonts/dm-serif-display-latin.woff2") format("woff2"); }
  * { box-sizing: border-box; margin: 0; }
  body {
    position: relative; width: 1200px; height: 630px; overflow: hidden;
    display: flex; flex-direction: column; justify-content: center; gap: 20px; padding: 0 90px;
    font-family: system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; color: #f6efd8;
    background:
      linear-gradient(90deg, rgba(7, 14, 34, 0.96) 0%, rgba(7, 14, 34, 0.82) 48%, rgba(7, 14, 34, 0.2) 100%),
      url("../assets/media/hero-720.jpg") 50% 4% / 120% auto,
      #0a1329;
  }
  .role { font-size: 24px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: #ffe08a; }
  .role::before { content: "\2726"; margin-right: 14px; color: #f2c14e; }
  h1 { max-width: 640px; font: 400 98px/1.02 "DM Serif Display", Georgia, serif; }
  h1 span { background: linear-gradient(120deg, #ffe08a 10%, #f2c14e 55%, #e08a2c); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .stack { font-size: 28px; color: #b0bcd9; }
  .url { position: absolute; left: 90px; bottom: 54px; font-size: 24px; font-weight: 600; letter-spacing: 0.04em; color: #f6efd8; }
  .frame {
    position: absolute; right: 90px; top: 70px; width: 360px; padding: 10px;
    border-radius: 50% 50% 26px 26px / 37.5% 37.5% 26px 26px;
    background: linear-gradient(160deg, #ffe9a3, #d9962b 52%, #7a4e08);
    box-shadow: 0 30px 70px -20px rgba(0, 0, 0, 0.8), 0 0 90px -10px rgba(255, 216, 107, 0.45);
  }
  .frame img { display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 50% 50% 17px 17px / 37.5% 37.5% 17px 17px; }
</style>
</head>
<body>
  <div class="frame"><img src="../assets/media/hero-720.jpg" alt=""></div>
  <p class="role">Software Engineer</p>
  <h1>Harshaan <span>Nihal Khan</span></h1>
  <p class="stack">Ruby on Rails &middot; React &middot; Node &middot; React Native</p>
  <p class="url">harshaannihal.github.io</p>
</body>
</html>
