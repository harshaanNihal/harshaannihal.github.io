# Site settings
title: Harshaan Nihal Khan
tagline: Software Engineer
email: harshaan.n.khan@gmail.com
description: >-
  Software engineer in Udaipur, India. I build web and mobile products with
  Ruby on Rails, React, Node and React Native. Selected work and writing.
url: "https://harshaannihal.github.io"
baseurl: ""
timezone: Asia/Kolkata # post dates carry +0530; without this Pages renders them in UTC
twitter_username: klassynihal
github_username: harshaanNihal

# SEO tags (jekyll-seo-tag)
twitter:
  username: klassynihal
  card: summary_large_image
social:
  name: Harshaan Nihal Khan
  links:
    - https://github.com/harshaanNihal
    - https://twitter.com/klassynihal

# The default share image. A post can set its own `image:` in front matter.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/media/og.jpg

# Build settings
markdown: kramdown
permalink: /blog/:title
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

# Keep repo-only files out of the published site. (_src and other underscore folders never publish.)
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - tools/
