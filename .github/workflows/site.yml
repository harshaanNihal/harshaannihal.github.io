# Builds the Astro site in site/ and publishes it to GitHub Pages at https://harshaannihal.github.io/.
# Every push and pull request is type-checked and built; only master is deployed.
# Pages must be set to deploy from GitHub Actions (Settings, Pages, Build and deployment, Source).
name: Site

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          # The API's address, once it exists (api/README.md). Without it the site builds without the form and counter.
          PUBLIC_API_URL: ${{ vars.API_URL }}
      - if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
