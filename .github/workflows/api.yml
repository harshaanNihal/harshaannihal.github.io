# Tests the API on every change to it, and deploys it to Cloudflare Workers from master. Deploying needs the
# repository variable API_URL and the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see api/README.md);
# until API_URL is set, the job only tests.
name: API

on:
  push:
    branches: [master]
    paths: ['api/**', 'packages/contract/**', 'package-lock.json', '.github/workflows/api.yml']
  pull_request:
    paths: ['api/**', 'packages/contract/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check -w api
      - run: npm test -w api

  deploy:
    if: github.ref == 'refs/heads/master' && vars.API_URL != ''
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        working-directory: .
      - run: npx wrangler d1 migrations apply DB --remote
      - run: npx wrangler deploy
