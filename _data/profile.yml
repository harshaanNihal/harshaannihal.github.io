    start: 2024-07-01
    end: 2026-02-01
    positions:
      - title: Software Engineer III
        notes:
          - Architected a cloud packet-capture (PCAP) service for Meraki switches, for real-time packet analysis.
          - Built distributed systems that process high-volume network traffic data.
          - Shipped full-stack features for the switches dashboard in React and Ruby on Rails, working with the hardware and firmware teams.
        tech: [Ruby on Rails, React, Ruby, JavaScript]
  - company: Saeloun
    start: 2022-06-01
    end: 2024-07-01
    positions:
      - title: Software Engineer
        notes:
          - Co-built logistics software for a cloud-kitchen startup's meal deliveries on Rails, Postgres, Redis, Sidekiq Pro and Heroku. It carried the company's expansion beyond California.
          - Led the GraphQL backend and client API for a customer-facing React app (graphql-ruby, Apollo).
          - Added end-to-end tests for critical workflows with Capybara and Cypress.
        tech: [Ruby on Rails, React, GraphQL, Apollo Client, PostgreSQL, Redis, Sidekiq, Heroku, Cypress, Capybara, Ruby, JavaScript]
  - company: BigBinary
    start: 2019-09-01
    end: 2022-05-01
    positions:
      - title: Software Engineer and Team Lead, on contract to Vineti
        notes:
          - Led the team delivering cell and gene therapy workflows for healthcare clients, configured per client in Rails and YAML.
          - Built REST APIs and microservices, contract-tested with Pact.
          - Mentored and onboarded engineers, and set up code review and TDD practices.
        tech: [Ruby on Rails, Ruby, YAML, Pact]
      - title: Mobile Developer, NeetoDesk
        notes:
          - Built NeetoDesk's mobile ticketing app from scratch in React Native, with peer-to-peer chat.
          - Added filtered ticket views, automated email configuration and first-response-time reports.
        tech: [React Native, JavaScript]

